          multivalued: true
  InTotoAdditionalDigest:
    name: InTotoAdditionalDigest
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoAdditionalDigest
    description: One digest under an algorithm that InTotoDigestSet does not name,
      such as an SCS's own revision type.
    comments:
    - In the attestation's JSON the algorithm is a key of the digest set beside the
      named ones, and an algorithm the framework does not define documents how its
      value is encoded.
    - An SCS that does not use cryptographic digests defines a canonical revision
      type of its own that includes the repository, such as svn_revision_id.
    - Each algorithm appears once in a list, since the attestation's JSON uses it
      as a key; the validator does not check this.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    slots:
    - inTotoAdditionalDigest__algorithm
    - inTotoAdditionalDigest__value
    attributes:
      algorithm:
        name: algorithm
        description: The algorithm's name, as the key the attestation's JSON uses,
          such as svn_revision_id.
        comments:
        - An algorithm that InTotoDigestSet names, by its JSON key or by its field
          name, goes in that field instead.
        slot_uri: spdx:algorithm
        required: true
        pattern: ^[a-z][A-Za-z0-9_]*$
        none_of:
        - equals_string_in: *id001
      value:
        name: value
        description: The digest under that algorithm, in the encoding the algorithm
          documents.
        required: true
        pattern: ^\S+$
    class_uri: in_toto_linkml:InTotoAdditionalDigest
  InTotoAnnotation:
    name: InTotoAnnotation
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoAnnotation
    description: 'One vendor-specific annotation on a resource descriptor: a key and
      its values.'
    comments:
    - The attestation's JSON allows any JSON value. A string becomes one value and
      an array one value per item; any other value or item is written as its JSON
      text, so one value cannot tell a string from a one-item array.
    - Each key appears once in a list, since the attestation's JSON uses it as a key;
      the validator does not check this.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slots:
    - inTotoAnnotation__annotation_key
    - inTotoAnnotation__annotation_values
    attributes:
      annotation_key:
        name: annotation_key
        description: The annotation's key.
        required: true
      annotation_values:
        name: annotation_values
        description: The annotation's values.
        multivalued: true
    class_uri: in_toto_linkml:InTotoAnnotation
  InTotoResourceDescriptor:
    name: InTotoResourceDescriptor
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoResourceDescriptor
    description: A reference to a software artifact or other resource by URI or digest,
      or the resource itself as content, with optional metadata.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the
      JSON Schema generator leaves a condition's own range out, and a null value would
      then count as present.
    comments:
    - A descriptor carries at least one of a URI, a digest or its content; a field
      that needs a particular one says so.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/resource_descriptor.md
    slots:
    - resource_uri
    - digest
    - inTotoResourceDescriptor__resource_name
    - inTotoResourceDescriptor__download_location
    - inTotoResourceDescriptor__media_type
    - inTotoResourceDescriptor__content
    - inTotoResourceDescriptor__annotations
    attributes:
      resource_name:
        name: resource_name
        description: A name for the resource within the attestation that carries it.
      download_location:
        name: download_location
        description: Where the resource can be fetched, when that differs from its
          identifying URI.
        range: uri
      media_type:
        name: media_type
        description: The IANA media type of the resource's content.
        slot_uri: dcat:mediaType
      content:
        name: content
        description: The resource's content itself, base64-encoded, for a resource
          small enough to carry inline.
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations
          stay small.
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
          references a SLSA Source Verification Summary records.
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoResourceDescriptor
    any_of:
    - slot_conditions:
        resource_uri:
          name: resource_uri
          required: true
          any_of:
          - range: uri
    - slot_conditions:
        digest:
          name: digest
          required: true
          any_of:
          - range: InTotoDigestSet
    - slot_conditions:
        content:
          name: content
          required: true
          any_of:
          - range: string
  InTotoStatementSubject:
    name: InTotoStatementSubject
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoStatementSubject
    description: 'One artifact an in-toto statement is about: a resource descriptor
      that carries a digest.'
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    is_a: InTotoResourceDescriptor
    slots:
    - resource_uri
    - inTotoResourceDescriptor__resource_name
    - inTotoResourceDescriptor__download_location
    - inTotoResourceDescriptor__media_type
    - inTotoResourceDescriptor__content
    - inTotoResourceDescriptor__annotations
    - InTotoStatementSubject_digest
    slot_usage:
      digest:
        name: digest
        required: true
    class_uri: in_toto_linkml:InTotoStatementSubject
  InTotoStatement:
    name: InTotoStatement
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoStatement
    description: 'The statement layer of an in-toto attestation: the subjects it is
      about, the type of its predicate and the predicate itself.'
    comments:
    - The signature envelope around a statement, and the bundle that collects signed
      statements, are outside this model.
    - A statement is the attestation, and its predicate is one kind of claim about
      the subjects, such as a test result or build provenance.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/statement.md
    slots:
    - inTotoStatement__statement_type
    - inTotoStatement__subject
    - inTotoStatement__predicate_type
    - inTotoStatement__statement_predicate
    attributes:
      statement_type:
        name: statement_type
        description: The in-toto statement type, always https://in-toto.io/Statement/v1.
        range: uri
        required: true
        pattern: ^https://in-toto\.io/Statement/v1$
      subject:
        name: subject
        description: The artifacts the predicate is about, each with a digest.
        range: InTotoStatementSubject
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      predicate_type:
        name: predicate_type
        description: The URI that names the predicate's type and so its schema, such
          as https://in-toto.io/attestation/test-result/v0.1.
        range: uri
        required: true
      statement_predicate:
        name: statement_predicate
        description: The predicate, one of the kinds this schema or an importing one
          models; predicate_kind names which. Unset means the same as empty.
        comments:
        - The attestation's JSON calls this field predicate. The name here keeps it
          apart from LOKF's predicate, the type of a relation, which a composite schema
          gives one IRI.
        range: InTotoPredicate
        inlined: true
    class_uri: in_toto_linkml:InTotoStatement
  InTotoPredicate:
    name: InTotoPredicate
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoPredicate
    description: The base of every predicate an in-toto statement can carry; predicate_kind
      names the concrete kind.
    comments:
    - The statement's predicate_type names the predicate's type by URI, and each concrete
      class says which URI it renders. Nothing ties the two, since a schema that imports
      this module may model a predicate under its own URI.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/predicate.md
    abstract: true
    slots:
    - inTotoPredicate__predicate_kind
    attributes:
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        designates_type: true
        range: string
    class_uri: in_toto_linkml:InTotoPredicate
  InTotoPredicateType:
    name: InTotoPredicateType
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoPredicateType
    description: A type of predicate an in-toto statement can carry, named by the
      URI a statement's predicate_type holds.
    comments:
    - The type URI includes the predicate's major version and changes when the predicate
      changes incompatibly; a minor version keeps it.
    - Anyone can define a predicate type. The in-toto project vets some of them, and
      vetted_as names which vetted type this one is.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/predicate.md
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    slots:
    - inTotoPredicateType__predicate_type_uri
    - inTotoPredicateType__predicate_version
    - inTotoPredicateType__predicate_specification
    - inTotoPredicateType__vetted_as
    attributes:
      predicate_type_uri:
        name: predicate_type_uri
        description: The URI that names the predicate type, such as https://in-toto.io/attestation/test-result/v0.1.
        range: uri
        required: true
      predicate_version:
        name: predicate_version
        description: The version of the predicate's specification, as its page states
          it, such as 0.1.0.
      predicate_specification:
        name: predicate_specification
        description: The page that specifies the predicate.
        range: uri
      vetted_as:
        name: vetted_as
        description: The vetted predicate this type is, when the in-toto project vetted
          it.
        range: InTotoVettedPredicate
    class_uri: in_toto_linkml:InTotoPredicateType
  InTotoObjectEntry:
    name: InTotoObjectEntry
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoObjectEntry
    description: One key of a JSON object whose keys the framework leaves to the producer,
      and the key's values.
    comments:
    - A string becomes one value and an array one value per item; any other value
      or item is written as its JSON text, as InTotoAnnotation does.
    - Each key appears once in a list, since the attestation's JSON uses it as a key;
      the validator does not check this.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    slots:
    - inTotoObjectEntry__entry_key
    - inTotoObjectEntry__entry_values
    attributes:
      entry_key:
        name: entry_key
        description: The object's key.
        required: true
      entry_values:
        name: entry_values
        description: The key's values.
        multivalued: true
    class_uri: in_toto_linkml:InTotoObjectEntry
  InTotoTestResult:
    name: InTotoTestResult
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoTestResult
    description: The predicate that records the result of one run of a test suite
      against the subjects, with the names of the tests that passed, warned and failed.
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/test-result/v0.1.
    - One attestation records one invocation of a suite.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md
    exact_mappings:
    - in_toto:test-result/v0.1
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoTestResult__test_result
    - inTotoTestResult__configuration
    - inTotoTestResult__test_run_url
    - inTotoTestResult__passed_tests
    - inTotoTestResult__warned_tests
    - inTotoTestResult__failed_tests
    attributes:
      test_result:
        name: test_result
        description: The result of the test run.
        range: InTotoTestResultValue
        required: true
      configuration:
        name: configuration
        description: The configuration the test run used.
        range: InTotoResourceDescriptor
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      test_run_url:
        name: test_run_url
        description: Where the test run can be read, such as a CI run that holds its
          logs; the verifier works out how to read it.
        range: uri
      passed_tests:
        name: passed_tests
        description: The names of the tests that passed.
        multivalued: true
      warned_tests:
        name: warned_tests
        description: The names of the tests that expressed a warning.
        multivalued: true
      failed_tests:
        name: failed_tests
        description: The names of the tests that failed.
        comments:
        - Producer and consumer agree on what a test name means; a policy can check
          that test_result and failed_tests meet its requirements.
        multivalued: true
    class_uri: in_toto_linkml:InTotoTestResult
  InTotoSimpleVerificationResult:
    name: InTotoSimpleVerificationResult
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoSimpleVerificationResult
    description: The predicate that says a verifier evaluated the subjects against
      one or more policies, and which properties passed.
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/svr/v0.1.
    - It is a lighter form of the SLSA Verification Summary, which lmodel/slsa models.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/svr.md
    exact_mappings:
    - in_toto:svr/v0.1
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoSimpleVerificationResult__svr_verifier
    - inTotoSimpleVerificationResult__time_created
    - inTotoSimpleVerificationResult__verified_properties
    attributes:
      svr_verifier:
        name: svr_verifier
        description: The entity that performed the verification.
        range: InTotoSvrVerifier
        required: true
        inlined: true
      time_created:
        name: time_created
        description: When the verification took place.
        range: InTotoTimestamp
        required: true
      verified_properties:
        name: verified_properties
        description: The properties of the subjects that passed verification, scoped
          to the framework or policy verified, such as SLSA_BUILD_LEVEL_3.
        required: true
        multivalued: true
    class_uri: in_toto_linkml:InTotoSimpleVerificationResult
  InTotoSvrVerifier:
    name: InTotoSvrVerifier
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoSvrVerifier
    description: The entity that performed a simple verification.
    comments:
    - A verifier with configurable policies may add fields of its own that say which
      policy it applied; this schema does not model them.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/svr.md
    slots:
    - inTotoSvrVerifier__svr_verifier_id
    attributes:
      svr_verifier_id:
        name: svr_verifier_id
        description: The URI that identifies the verifier, versioned when its verification
          logic changes materially.
        range: uri
        required: true
    class_uri: in_toto_linkml:InTotoSvrVerifier
  InTotoScaiAttributeReport:
    name: InTotoScaiAttributeReport
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoScaiAttributeReport
    description: 'The Software Supply Chain Attribute Integrity (SCAI) predicate:
      assertions about functional attributes of the subjects or their producer, each
      with the evidence for it.'
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/scai/v0.3.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    exact_mappings:
    - in_toto:scai/v0.3
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoScaiAttributeReport__scai_attributes
    - inTotoScaiAttributeReport__scai_producer
    attributes:
      scai_attributes:
        name: scai_attributes
        description: One or more attribute assertions about the subjects.
        range: InTotoScaiAttributeAssertion
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      scai_producer:
        name: scai_producer
        description: The producer of the subjects, where that applies.
        range: InTotoResourceDescriptor
        inlined: true
    class_uri: in_toto_linkml:InTotoScaiAttributeReport
  InTotoScaiAttributeAssertion:
    name: InTotoScaiAttributeAssertion
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoScaiAttributeAssertion
    description: 'One SCAI assertion: an attribute of the subject or its producer,
      what it applies to, under which conditions, and the evidence for it.'
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    slots:
    - inTotoScaiAttributeAssertion__scai_attribute
    - inTotoScaiAttributeAssertion__scai_target
    - inTotoScaiAttributeAssertion__scai_conditions
    - inTotoScaiAttributeAssertion__scai_evidence
    attributes:
      scai_attribute:
        name: scai_attribute
        description: The functional feature asserted, in a form the producer and consumer
          agree on.
        required: true
      scai_target:
        name: scai_target
        description: The artifact or metadata object the attribute applies to.
        range: InTotoResourceDescriptor
        inlined: true
      scai_conditions:
        name: scai_conditions
        description: The conditions under which the attribute arises.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      scai_evidence:
        name: scai_evidence
        description: The evidence, authenticated where possible, for the asserted
          attribute.
        comments:
        - Without evidence a consumer may judge the assertion by who produced the
          attestation.
        range: InTotoResourceDescriptor
        inlined: true
    class_uri: in_toto_linkml:InTotoScaiAttributeAssertion
  InTotoLink:
    name: InTotoLink
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoLink
    description: 'The predicate that records one step of an in-toto layout: the command
      it ran and the materials it read, for a supply chain that migrates from in-toto
      0.9 links.'
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/link/v0.3.
    - The statement's subjects are the step's products, and each subject's resource_name
      is unique within the attestation; the validator does not check this.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    exact_mappings:
    - in_toto:link/v0.3
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoLink__step_name
    - inTotoLink__step_command
    - inTotoLink__materials
    - inTotoLink__step_byproducts
    - inTotoLink__step_environment
    attributes:
      step_name:
        name: step_name
        description: The name of the step, which a layout uses to find the link metadata
          it verifies.
        required: true
      step_command:
        name: step_command
        description: The command the step ran, and its arguments; possibly empty.
        multivalued: true
      materials:
        name: materials
        description: The artifacts the step read.
        comments:
        - Each material's resource_name is unique among them; the validator does not
          check this.
        range: InTotoLinkMaterial
        multivalued: true
        inlined: true
        inlined_as_list: true
      step_byproducts:
        name: step_byproducts
        description: What else the step recorded, such as its standard output, in
          keys the in-toto specification describes.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      step_environment:
        name: step_environment
        description: The environment the step ran in, in keys the producer chooses.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoLink
  InTotoLinkMaterial:
    name: InTotoLinkMaterial
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoLinkMaterial
    description: One material of a link, a resource descriptor with a name and a digest.
    notes:
    - The name is required through a slot condition rather than slot_usage, because
      resource_name is an attribute of the parent class and the LinkML loader refuses
      slot_usage on an inherited attribute.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    is_a: InTotoResourceDescriptor
    slots:
    - resource_uri
    - inTotoResourceDescriptor__resource_name
    - inTotoResourceDescriptor__download_location
    - inTotoResourceDescriptor__media_type
    - inTotoResourceDescriptor__content
    - inTotoResourceDescriptor__annotations
    - InTotoLinkMaterial_digest
    slot_usage:
      digest:
        name: digest
        required: true
    class_uri: in_toto_linkml:InTotoLinkMaterial
    all_of:
    - slot_conditions:
        resource_name:
          name: resource_name
          required: true
          any_of:
          - range: string
  InTotoReference:
    name: InTotoReference
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoReference
    description: The predicate that points from the subjects, as a whole, to documents
      about them, such as a bill of materials.
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/reference/v0.1.
    - Several documents in one predicate read as if each had an attestation of its
      own with everything else unchanged.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    exact_mappings:
    - in_toto:reference/v0.1
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoReference__reference_attester
    - inTotoReference__referenced_documents
    attributes:
      reference_attester:
        name: reference_attester
        description: The system that provides the documents.
        range: InTotoReferenceAttester
        required: true
        inlined: true
      referenced_documents:
        name: referenced_documents
        description: The documents referred to.
        range: InTotoReferencedDocument
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: in_toto_linkml:InTotoReference
  InTotoReferenceAttester:
    name: InTotoReferenceAttester
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoReferenceAttester
    description: The system that provides the documents a Reference predicate points
      to.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    slots:
    - inTotoReferenceAttester__reference_attester_id
    attributes:
      reference_attester_id:
        name: reference_attester_id
        description: The URI that identifies the system.
        range: uri
        required: true
    class_uri: in_toto_linkml:InTotoReferenceAttester
  InTotoReferencedDocument:
    name: InTotoReferencedDocument
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoReferencedDocument
    description: 'One document a Reference predicate points to: a resource descriptor
      with a download location and a media type.'
    notes:
    - Both fields are required through slot conditions rather than slot_usage, because
      they are attributes of the parent class and the LinkML loader refuses slot_usage
      on an inherited attribute.
    comments:
    - A document of unknown type takes media_type application/octet-stream.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    is_a: InTotoResourceDescriptor
    slots:
    - resource_uri
    - digest
    - inTotoResourceDescriptor__resource_name
    - inTotoResourceDescriptor__download_location
    - inTotoResourceDescriptor__media_type
    - inTotoResourceDescriptor__content
    - inTotoResourceDescriptor__annotations
    class_uri: in_toto_linkml:InTotoReferencedDocument
    all_of:
    - slot_conditions:
        download_location:
          name: download_location
          required: true
          any_of:
          - range: uri
    - slot_conditions:
        media_type:
          name: media_type
          required: true
          any_of:
          - range: string
  InTotoRelease:
    name: InTotoRelease
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoRelease
    description: The predicate that ties the subjects to one release name and version
      of a package, so that consumers can check what the release should contain.
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/release/v0.1.
      The page is at version 0.2, which renamed releaseId to packageId, and its examples
      keep that URI.
    - Each subject's resource_name is the artifact's file name as it would appear
      on disk.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/release.md
    exact_mappings:
    - in_toto:release/v0.1
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoRelease__release_purl
    - inTotoRelease__package_id
    attributes:
      release_purl:
        name: release_purl
        description: The package URL that names the release, with its version and,
          unless the package type needs them, no qualifiers or subpath.
        range: uri
        required: true
        pattern: ^pkg:[A-Za-z.+-]+/[^@?#]+@[^?#]+
      package_id:
        name: package_id
        description: A stable identifier for the package that does not change between
          releases, so that a consumer can tell a renamed package from a reused name.
    class_uri: in_toto_linkml:InTotoRelease
  InTotoRuntimeTrace:
    name: InTotoRuntimeTrace
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoRuntimeTrace
    description: The predicate that records what a monitor traced while a supply chain
      step, such as a build, ran.
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/runtime-trace/v0.1.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    exact_mappings:
    - in_toto:runtime-trace/v0.1
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoRuntimeTrace__trace_monitor
    - inTotoRuntimeTrace__monitored_process
    - inTotoRuntimeTrace__monitor_log
    - inTotoRuntimeTrace__trace_metadata
    attributes:
      trace_monitor:
        name: trace_monitor
        description: The monitor instance that traced the run.
        range: InTotoTraceMonitor
        required: true
        inlined: true
      monitored_process:
        name: monitored_process
        description: The process the monitor watched.
        range: InTotoMonitoredProcess
        required: true
        inlined: true
      monitor_log:
        name: monitor_log
        description: The events the monitor traced.
        range: InTotoMonitorLog
        required: true
        inlined: true
      trace_metadata:
        name: trace_metadata
        description: Other properties of the monitoring event.
        range: InTotoTraceMetadata
        inlined: true
    class_uri: in_toto_linkml:InTotoRuntimeTrace
  InTotoTraceMonitor:
    name: InTotoTraceMonitor
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoTraceMonitor
    description: The monitor instance that produced a runtime trace.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    slots:
    - inTotoTraceMonitor__monitor_type
    - inTotoTraceMonitor__monitor_config_source
    - inTotoTraceMonitor__trace_policy
    attributes:
      monitor_type:
        name: monitor_type
        description: The URI of the monitor's type.
        range: uri
        required: true
      monitor_config_source:
        name: monitor_config_source
        description: The monitor's configuration.
        range: InTotoResourceDescriptor
        inlined: true
      trace_policy:
        name: trace_policy
        description: The trace policy the monitor applied, in the monitor's own format,
          which monitor_type names.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoTraceMonitor
  InTotoMonitoredProcess:
    name: InTotoMonitoredProcess
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoMonitoredProcess
    description: The process a runtime trace watched.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    slots:
    - inTotoMonitoredProcess__host_id
    - inTotoMonitoredProcess__process_type
    - inTotoMonitoredProcess__process_event
    attributes:
      host_id:
        name: host_id
        description: The URI that identifies the host the process ran on.
        range: uri
        required: true
      process_type:
        name: process_type
        description: The URI of the type of process, such as the build type when the
          monitor watched a build.
        range: uri
        required: true
      process_event:
        name: process_event
        description: The job or task the attestation is about.
        required: true
    class_uri: in_toto_linkml:InTotoMonitoredProcess
  InTotoMonitorLog:
    name: InTotoMonitorLog
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoMonitorLog
    description: 'The events a runtime trace''s monitor recorded: processes, network
      activity and file accesses, at least one of them.'
    notes:
    - Each condition in any_of names its range through a nested any_of, because the
      JSON Schema generator leaves a condition's own range out, and a null value would
      then count as present.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    slots:
    - inTotoMonitorLog__traced_processes
    - inTotoMonitorLog__traced_network
    - inTotoMonitorLog__file_access
    attributes:
      traced_processes:
        name: traced_processes
        description: The processes the monitor observed, one JSON object each, written
          as its JSON text, in a format monitor_type determines.
        multivalued: true
      traced_network:
        name: traced_network
        description: The network activity the monitor observed, one JSON object each,
          written as its JSON text, in a format monitor_type determines.
        multivalued: true
      file_access:
        name: file_access
        description: The files the run accessed, each with its path and digests; one
          file may appear more than once, with different digests if it changed.
        comments:
        - A monitor that cannot pause the build, such as one that uses eBPF, guarantees
          less about these digests than one that can.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoMonitorLog
    any_of:
    - slot_conditions:
        traced_processes:
          name: traced_processes
          required: true
          multivalued: true
    - slot_conditions:
        traced_network:
          name: traced_network
          required: true
          multivalued: true
    - slot_conditions:
        file_access:
          name: file_access
          required: true
          multivalued: true
  InTotoTraceMetadata:
    name: InTotoTraceMetadata
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoTraceMetadata
    description: Other properties of a runtime trace's monitoring event.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    slots:
    - inTotoTraceMetadata__build_started_on
    - inTotoTraceMetadata__build_finished_on
    attributes:
      build_started_on:
        name: build_started_on
        description: When the monitored build started.
        range: InTotoTimestamp
      build_finished_on:
        name: build_finished_on
        description: When the monitored build finished.
        range: InTotoTimestamp
    class_uri: in_toto_linkml:InTotoTraceMetadata
  InTotoVulns:
    name: InTotoVulns
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVulns
    description: 'The predicate that records the result of one vulnerability scan
      of the subjects: the scanner, its database and the vulnerabilities it found.'
    comments:
    - The statement that carries it has predicate_type https://in-toto.io/attestation/vulns/v0.2.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    exact_mappings:
    - in_toto:vulns/v0.2
    is_a: InTotoPredicate
    slots:
    - inTotoPredicate__predicate_kind
    - inTotoVulns__vuln_scanner
    - inTotoVulns__scan_metadata
    attributes:
      vuln_scanner:
        name: vuln_scanner
        description: The scanner that ran, its version and the database it used.
        range: InTotoVulnScanner
        required: true
        inlined: true
      scan_metadata:
        name: scan_metadata
        description: When the scan ran.
        range: InTotoScanMetadata
        required: true
        inlined: true
    class_uri: in_toto_linkml:InTotoVulns
  InTotoVulnScanner:
    name: InTotoVulnScanner
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVulnScanner
    description: The scanner a VULNS predicate records, with its results.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    slots:
    - inTotoVulnScanner__scanner_uri
    - inTotoVulnScanner__scanner_version
    - inTotoVulnScanner__vuln_db
    - inTotoVulnScanner__scan_results
    attributes:
      scanner_uri:
        name: scanner_uri
        description: The URI that identifies the scanner's source.
        range: uri
        required: true
      scanner_version:
        name: scanner_version
        description: The scanner's version.
      vuln_db:
        name: vuln_db
        description: The vulnerability database the scanner used.
        range: InTotoVulnDatabase
        inlined: true
      scan_results:
        name: scan_results
        description: The vulnerabilities the scanner found; an empty list means it
          found none.
        range: InTotoVulnResult
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoVulnScanner
  InTotoVulnDatabase:
    name: InTotoVulnDatabase
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVulnDatabase
    description: The vulnerability database a scanner used.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    slots:
    - inTotoVulnDatabase__db_uri
    - inTotoVulnDatabase__db_version
    - inTotoVulnDatabase__db_last_update
    attributes:
      db_uri:
        name: db_uri
        description: The URI that identifies the database's source.
        range: uri
      db_version:
        name: db_version
        description: The database's version.
      db_last_update:
        name: db_last_update
        description: When the database was last updated.
        range: InTotoTimestamp
        required: true
    class_uri: in_toto_linkml:InTotoVulnDatabase
  InTotoVulnResult:
    name: InTotoVulnResult
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVulnResult
    description: One vulnerability a scanner found.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    slots:
    - inTotoVulnResult__vuln_id
    - inTotoVulnResult__vuln_severity
    - inTotoVulnResult__vuln_annotations
    attributes:
      vuln_id:
        name: vuln_id
        description: The vulnerability's identifier, such as GHSA-fxph-q3j8-mv87 or
          CVE-2017-5645.
        required: true
      vuln_severity:
        name: vuln_severity
        description: The vulnerability's severity, by one or more scoring methods.
        range: InTotoVulnSeverity
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      vuln_annotations:
        name: vuln_annotations
        description: Custom information the scanner adds, as key and value pairs.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoVulnResult
  InTotoVulnSeverity:
    name: InTotoVulnSeverity
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVulnSeverity
    description: One severity score of a vulnerability, by one scoring method.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    slots:
    - inTotoVulnSeverity__severity_method
    - inTotoVulnSeverity__severity_score
    attributes:
      severity_method:
        name: severity_method
        description: The scoring method, such as nvd or cvss.
        required: true
      severity_score:
        name: severity_score
        description: The score under that method, as a string.
        required: true
    class_uri: in_toto_linkml:InTotoVulnSeverity
  InTotoScanMetadata:
    name: InTotoScanMetadata
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoScanMetadata
    description: When a vulnerability scan ran.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    slots:
    - inTotoScanMetadata__scan_started_on
    - inTotoScanMetadata__scan_finished_on
    attributes:
      scan_started_on:
        name: scan_started_on
        description: When the scan started.
        range: InTotoTimestamp
        required: true
      scan_finished_on:
        name: scan_finished_on
        description: When the scan finished.
        range: InTotoTimestamp
        required: true
    class_uri: in_toto_linkml:InTotoScanMetadata
