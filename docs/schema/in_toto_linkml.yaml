classes:
  InTotoDocument:
    name: InTotoDocument
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoDocument
    description: A document that holds in-toto statements and the predicate types
      they name.
    from_schema: https://w3id.org/lmodel/in-toto
    slots:
    - inTotoDocument__in_toto_statements
    - inTotoDocument__in_toto_predicate_types
    attributes:
      in_toto_statements:
        name: in_toto_statements
        description: The statements, each an in-toto attestation without its envelope.
        range: InTotoStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      in_toto_predicate_types:
        name: in_toto_predicate_types
        description: The predicate types.
        range: InTotoPredicateType
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: in_toto_linkml:InTotoDocument
    tree_root: true
  InTotoDigestSet:
    name: InTotoDigestSet
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoDigestSet
    description: A set of one or more digests over one artifact, keyed by algorithm,
      from which a consumer picks the algorithm it trusts.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the
      JSON Schema generator leaves a condition's own range out, and a null value would
      then count as present.
    comments:
    - The named algorithms take lowercase hexadecimal, and additional_digests holds
      any other algorithm, such as an SCS's own revision type.
    - A consumer accepts only the algorithms it considers secure and ignores the rest,
      and two sets match when any accepted algorithm matches.
    - SHAKE and BLAKE2 digests can be of any length, and this schema asks for at least
      32 bytes, since a shorter digest resists collisions too weakly to identify an
      artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    slots:
    - inTotoDigestSet__sha256
    - inTotoDigestSet__sha224
    - inTotoDigestSet__sha384
    - inTotoDigestSet__sha512
    - inTotoDigestSet__sha512_224
    - inTotoDigestSet__sha512_256
    - inTotoDigestSet__sha3_224
    - inTotoDigestSet__sha3_256
    - inTotoDigestSet__sha3_384
    - inTotoDigestSet__sha3_512
    - inTotoDigestSet__shake128
    - inTotoDigestSet__shake256
    - inTotoDigestSet__blake2b
    - inTotoDigestSet__blake2s
    - inTotoDigestSet__ripemd160
    - inTotoDigestSet__sm3
    - inTotoDigestSet__gost
    - inTotoDigestSet__sha1
    - inTotoDigestSet__md5
    - inTotoDigestSet__dir_hash
    - inTotoDigestSet__git_commit
    - inTotoDigestSet__git_tree
    - inTotoDigestSet__git_blob
    - inTotoDigestSet__git_tag
    - inTotoDigestSet__additional_digests
    attributes:
      sha256:
        name: sha256
        description: The SHA-256 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      sha224:
        name: sha224
        description: The SHA-224 digest of the artifact.
        pattern: ^[a-f0-9]{56}$
      sha384:
        name: sha384
        description: The SHA-384 digest of the artifact.
        pattern: ^[a-f0-9]{96}$
      sha512:
        name: sha512
        description: The SHA-512 digest of the artifact.
        pattern: ^[a-f0-9]{128}$
      sha512_224:
        name: sha512_224
        description: The SHA-512/224 digest of the artifact.
        pattern: ^[a-f0-9]{56}$
      sha512_256:
        name: sha512_256
        description: The SHA-512/256 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      sha3_224:
        name: sha3_224
        description: The SHA3-224 digest of the artifact.
        pattern: ^[a-f0-9]{56}$
      sha3_256:
        name: sha3_256
        description: The SHA3-256 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      sha3_384:
        name: sha3_384
        description: The SHA3-384 digest of the artifact.
        pattern: ^[a-f0-9]{96}$
      sha3_512:
        name: sha3_512
        description: The SHA3-512 digest of the artifact.
        pattern: ^[a-f0-9]{128}$
      shake128:
        name: shake128
        description: The SHAKE128 digest of the artifact, of at least 32 bytes.
        pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
      shake256:
        name: shake256
        description: The SHAKE256 digest of the artifact, of at least 32 bytes.
        pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
      blake2b:
        name: blake2b
        description: The BLAKE2b digest of the artifact, of 32 to 64 bytes.
        pattern: ^[a-f0-9]{64}([a-f0-9]{2}){0,32}$
      blake2s:
        name: blake2s
        description: The BLAKE2s digest of the artifact, at its full 32 bytes.
        pattern: ^[a-f0-9]{64}$
      ripemd160:
        name: ripemd160
        description: The RIPEMD-160 digest of the artifact.
        pattern: ^[a-f0-9]{40}$
      sm3:
        name: sm3
        description: The SM3 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      gost:
        name: gost
        description: The GOST R 34.11 digest of the artifact, of 256 or 512 bits.
        pattern: ^[a-f0-9]{64}([a-f0-9]{64})?$
      sha1:
        name: sha1
        description: The SHA-1 digest of the artifact.
        comments:
        - SHA-1 lacks collision resistance, so most consumers should not rely on it.
        pattern: ^[a-f0-9]{40}$
      md5:
        name: md5
        description: The MD5 digest of the artifact.
        comments:
        - MD5 lacks collision resistance, so most consumers should not accept it.
        pattern: ^[a-f0-9]{32}$
      dir_hash:
        name: dir_hash
        description: A digest over a directory's content by the dirhash Hash1 function,
          in lowercase hexadecimal rather than base64.
        pattern: ^[a-f0-9]{64}$
      git_commit:
        name: git_commit
        description: The git commit id of a source revision.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tree:
        name: git_tree
        description: The git tree id of a source revision's content, or of any file
          tree.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_blob:
        name: git_blob
        description: The git blob id of a file's content.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tag:
        name: git_tag
        description: The git object id of an annotated tag.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      additional_digests:
        name: additional_digests
        description: The digests under algorithms this class does not name.
        range: InTotoAdditionalDigest
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: in_toto_linkml:InTotoDigestSet
    any_of:
    - slot_conditions:
        sha256:
          name: sha256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha224:
          name: sha224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha384:
          name: sha384
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512:
          name: sha512
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512_224:
          name: sha512_224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512_256:
          name: sha512_256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_224:
          name: sha3_224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_256:
          name: sha3_256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_384:
          name: sha3_384
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_512:
          name: sha3_512
          required: true
          any_of:
          - range: string
    - slot_conditions:
        shake128:
          name: shake128
          required: true
          any_of:
          - range: string
    - slot_conditions:
        shake256:
          name: shake256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        blake2b:
          name: blake2b
          required: true
          any_of:
          - range: string
    - slot_conditions:
        blake2s:
          name: blake2s
          required: true
          any_of:
          - range: string
    - slot_conditions:
        ripemd160:
          name: ripemd160
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sm3:
          name: sm3
          required: true
          any_of:
          - range: string
    - slot_conditions:
        gost:
          name: gost
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha1:
          name: sha1
          required: true
          any_of:
          - range: string
    - slot_conditions:
        md5:
          name: md5
          required: true
          any_of:
          - range: string
    - slot_conditions:
        dir_hash:
          name: dir_hash
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_commit:
          name: git_commit
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_tree:
          name: git_tree
          required: true
          any_of:
          - range: string
