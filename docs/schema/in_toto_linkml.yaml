name: in_toto_linkml
annotations:
  attestation_tag:
    tag: attestation_tag
    value: v1.2.0
  attestation_commit:
    tag: attestation_commit
    value: df02077bf97218a8860a5c534eff1f1381f56984
description: 'A LinkML model of the in-toto Attestation Framework: the statement that
  binds an attestation to its subjects, the resource descriptor and digest set that
  identify an artifact, the predicate types the in-toto project has vetted, and the
  vetted predicates that no other lmodel schema models.'
title: in-toto Attestation Framework
comments:
- The version is the release of in-toto/attestation the model renders, and the specification
  pages and protocol buffer definitions of that release are copied to src/in_toto_linkml/schema/attestation/
  at the tag and commit in the annotations. The release tags are the schema's own
  versions, and scripts/check_upstream_release.py reads the same pins and reports
  when the in-toto project releases again or the copy drifts.
- in_toto_core imports only the LinkML types, in_toto_predicates imports the core,
  and this file adds only the document root, so an importer can take one module. lmodel/slsa
  imports the core and models SLSA's own predicates.
source: https://github.com/in-toto/attestation/tree/v1.2.0
see_also:
- https://lmodel.github.io/in-toto
- https://github.com/in-toto/attestation/blob/v1.2.0/spec/README.md
- https://in-toto.io/
id: https://w3id.org/lmodel/in-toto
version: 1.2.0
imports:
- linkml:types
- ./in_toto_core
- ./in_toto_predicates
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  in_toto_linkml:
    prefix_prefix: in_toto_linkml
    prefix_reference: https://w3id.org/lmodel/in-toto/
default_prefix: in_toto_linkml
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  InTotoTimestamp:
    name: InTotoTimestamp
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoTimestamp
    description: A point in time in RFC 3339 format in the UTC time zone, written
      with a trailing Z, such as 1985-04-12T23:20:50.52Z.
    comments:
    - It extends string rather than datetime, because the LinkML Python runtime writes
      a datetime's Z as +00:00, which the framework does not allow.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#timestamp
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$
enums:
  InTotoTestResultValue:
    name: InTotoTestResultValue
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoTestResultValue
    description: The result of a test run, as a Test Result predicate records it.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md
    permissible_values:
      PASSED:
        text: PASSED
        description: The run passed.
      WARNED:
        text: WARNED
        description: The run passed with warnings.
      FAILED:
        text: FAILED
        description: The run failed.
  InTotoVettedPredicate:
    name: InTotoVettedPredicate
    definition_uri: https://w3id.org/lmodel/in-toto/InTotoVettedPredicate
    description: The thirteen predicate types the in-toto project lists as vetted
      at release v1.2.0, each with the predicate_type a statement of it carries at
      the version its page describes.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_predicates
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    permissible_values:
      CYCLONEDX:
        text: CYCLONEDX
        description: A CycloneDX bill of materials for software artifacts.
        meaning: cyclonedx:bom/v1.4
        see_also:
        - https://cyclonedx.org/
      LINK:
        text: LINK
        description: One step of an in-toto layout, for migration from in-toto 0.9.
        meaning: in_toto:link/v0.3
      REFERENCE:
        text: REFERENCE
        description: References to documents relevant to a resource.
        meaning: in_toto:reference/v0.1
      RELEASE:
        text: RELEASE
        description: An artifact that is part of a given release version.
        meaning: in_toto:release/v0.1
      RUNTIME_TRACE:
        text: RUNTIME_TRACE
        description: Runtime traces of software supply chain operations.
        meaning: in_toto:runtime-trace/v0.1
      SCAI:
        text: SCAI
        description: Evidence-based assertions about software artifact and supply
          chain attributes or behaviour.
        meaning: in_toto:scai/v0.3
      SLSA_PROVENANCE:
        text: SLSA_PROVENANCE
        description: How an artifact or set of artifacts was produced; lmodel/slsa
          models it.
        meaning: slsa_spec:provenance/v1
      SLSA_VERIFICATION_SUMMARY:
        text: SLSA_VERIFICATION_SUMMARY
        description: A SLSA verification decision about a software artifact; lmodel/slsa
          models it.
        meaning: slsa_spec:verification_summary/v1
      SPDX2:
        text: SPDX2
        description: An SPDX 2 bill of materials for software artifacts.
        meaning: spdx_spec:Document/v2.3
      SPDX3:
        text: SPDX3
        description: An SPDX 3 bill of materials for software artifacts.
        meaning: spdx_spec:Document/v3
      SIMPLE_VERIFICATION_RESULT:
        text: SIMPLE_VERIFICATION_RESULT
        description: Evidence that an artifact was evaluated against one or more policies.
        meaning: in_toto:svr/v0.1
      TEST_RESULT:
        text: TEST_RESULT
        description: The results of any type of test.
        meaning: in_toto:test-result/v0.1
      VULNS:
        text: VULNS
        description: The results of a vulnerability scan of software artifacts.
        meaning: in_toto:vulns/v0.2
slots:
  resource_uri:
    name: resource_uri
    definition_uri: https://w3id.org/lmodel/in-toto/resource_uri
    description: The URI that identifies a resource, such as a package URL, a git
      repository address or an OCI image reference.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri
    mappings:
    - in_toto_linkml:resource_uri
    slot_uri: in_toto_linkml:resource_uri
    owner: InTotoResourceDescriptor
    domain_of:
    - InTotoResourceDescriptor
    range: uri
  digest:
    name: digest
    definition_uri: https://w3id.org/lmodel/in-toto/digest
    description: The cryptographic digests of a resource's content, keyed by algorithm.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    see_also:
    - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/digest_set.md
    mappings:
    - in_toto_linkml:digest
    slot_uri: in_toto_linkml:digest
    owner: InTotoResourceDescriptor
    domain_of:
    - InTotoResourceDescriptor
    range: InTotoDigestSet
    inlined: true
    inlined_as_list: true
  inTotoDocument__in_toto_statements:
    name: inTotoDocument__in_toto_statements
    description: The statements, each an in-toto attestation without its envelope.
    from_schema: https://w3id.org/lmodel/in-toto
    slot_uri: in_toto_linkml:in_toto_statements
    alias: in_toto_statements
    owner: InTotoDocument
    domain_of:
    - InTotoDocument
    range: InTotoStatement
    multivalued: true
    inlined: true
    inlined_as_list: true
  inTotoDocument__in_toto_predicate_types:
    name: inTotoDocument__in_toto_predicate_types
    description: The predicate types.
    from_schema: https://w3id.org/lmodel/in-toto
    slot_uri: in_toto_linkml:in_toto_predicate_types
    alias: in_toto_predicate_types
    owner: InTotoDocument
    domain_of:
    - InTotoDocument
    range: InTotoPredicateType
    multivalued: true
    inlined: true
    inlined_as_list: true
  inTotoDigestSet__sha256:
    name: inTotoDigestSet__sha256
    description: The SHA-256 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha256
    alias: sha256
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__sha224:
    name: inTotoDigestSet__sha224
    description: The SHA-224 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha224
    alias: sha224
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{56}$
  inTotoDigestSet__sha384:
    name: inTotoDigestSet__sha384
    description: The SHA-384 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha384
    alias: sha384
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{96}$
  inTotoDigestSet__sha512:
    name: inTotoDigestSet__sha512
    description: The SHA-512 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha512
    alias: sha512
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{128}$
  inTotoDigestSet__sha512_224:
    name: inTotoDigestSet__sha512_224
    description: The SHA-512/224 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha512_224
    alias: sha512_224
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{56}$
  inTotoDigestSet__sha512_256:
    name: inTotoDigestSet__sha512_256
    description: The SHA-512/256 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha512_256
    alias: sha512_256
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__sha3_224:
    name: inTotoDigestSet__sha3_224
    description: The SHA3-224 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha3_224
    alias: sha3_224
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{56}$
  inTotoDigestSet__sha3_256:
    name: inTotoDigestSet__sha3_256
    description: The SHA3-256 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha3_256
    alias: sha3_256
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__sha3_384:
    name: inTotoDigestSet__sha3_384
    description: The SHA3-384 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha3_384
    alias: sha3_384
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{96}$
  inTotoDigestSet__sha3_512:
    name: inTotoDigestSet__sha3_512
    description: The SHA3-512 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha3_512
    alias: sha3_512
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{128}$
  inTotoDigestSet__shake128:
    name: inTotoDigestSet__shake128
    description: The SHAKE128 digest of the artifact, of at least 32 bytes.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:shake128
    alias: shake128
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
  inTotoDigestSet__shake256:
    name: inTotoDigestSet__shake256
    description: The SHAKE256 digest of the artifact, of at least 32 bytes.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:shake256
    alias: shake256
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
  inTotoDigestSet__blake2b:
    name: inTotoDigestSet__blake2b
    description: The BLAKE2b digest of the artifact, of 32 to 64 bytes.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:blake2b
    alias: blake2b
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}([a-f0-9]{2}){0,32}$
  inTotoDigestSet__blake2s:
    name: inTotoDigestSet__blake2s
    description: The BLAKE2s digest of the artifact, at its full 32 bytes.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:blake2s
    alias: blake2s
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__ripemd160:
    name: inTotoDigestSet__ripemd160
    description: The RIPEMD-160 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:ripemd160
    alias: ripemd160
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}$
  inTotoDigestSet__sm3:
    name: inTotoDigestSet__sm3
    description: The SM3 digest of the artifact.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sm3
    alias: sm3
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__gost:
    name: inTotoDigestSet__gost
    description: The GOST R 34.11 digest of the artifact, of 256 or 512 bits.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:gost
    alias: gost
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}([a-f0-9]{64})?$
  inTotoDigestSet__sha1:
    name: inTotoDigestSet__sha1
    description: The SHA-1 digest of the artifact.
    comments:
    - SHA-1 lacks collision resistance, so most consumers should not rely on it.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:sha1
    alias: sha1
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}$
  inTotoDigestSet__md5:
    name: inTotoDigestSet__md5
    description: The MD5 digest of the artifact.
    comments:
    - MD5 lacks collision resistance, so most consumers should not accept it.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:md5
    alias: md5
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{32}$
  inTotoDigestSet__dir_hash:
    name: inTotoDigestSet__dir_hash
    description: A digest over a directory's content by the dirhash Hash1 function,
      in lowercase hexadecimal rather than base64.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:dir_hash
    alias: dir_hash
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{64}$
  inTotoDigestSet__git_commit:
    name: inTotoDigestSet__git_commit
    description: The git commit id of a source revision.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:git_commit
    alias: git_commit
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
  inTotoDigestSet__git_tree:
    name: inTotoDigestSet__git_tree
    description: The git tree id of a source revision's content, or of any file tree.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:git_tree
    alias: git_tree
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
  inTotoDigestSet__git_blob:
    name: inTotoDigestSet__git_blob
    description: The git blob id of a file's content.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:git_blob
    alias: git_blob
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
  inTotoDigestSet__git_tag:
    name: inTotoDigestSet__git_tag
    description: The git object id of an annotated tag.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:git_tag
    alias: git_tag
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: string
    pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
  inTotoDigestSet__additional_digests:
    name: inTotoDigestSet__additional_digests
    description: The digests under algorithms this class does not name.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:additional_digests
    alias: additional_digests
    owner: InTotoDigestSet
    domain_of:
    - InTotoDigestSet
    range: InTotoAdditionalDigest
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  inTotoAdditionalDigest__algorithm:
    name: inTotoAdditionalDigest__algorithm
    description: The algorithm's name, as the key the attestation's JSON uses, such
      as svn_revision_id.
    comments:
    - An algorithm that InTotoDigestSet names, by its JSON key or by its field name,
      goes in that field instead.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    mappings:
    - spdx:algorithm
    slot_uri: spdx:algorithm
    alias: algorithm
    owner: InTotoAdditionalDigest
    domain_of:
    - InTotoAdditionalDigest
    range: string
    required: true
    pattern: ^[a-z][A-Za-z0-9_]*$
    none_of:
    - equals_string_in: &id001
      - sha256
      - sha224
      - sha384
      - sha512
      - sha512_224
      - sha512_256
      - sha3_224
      - sha3_256
      - sha3_384
      - sha3_512
      - shake128
      - shake256
      - blake2b
      - blake2s
      - ripemd160
      - sm3
      - gost
      - sha1
      - md5
      - dirHash
      - gitCommit
      - gitTree
      - gitBlob
      - gitTag
      - dir_hash
      - git_commit
      - git_tree
      - git_blob
      - git_tag
  inTotoAdditionalDigest__value:
    name: inTotoAdditionalDigest__value
    description: The digest under that algorithm, in the encoding the algorithm documents.
    from_schema: https://w3id.org/lmodel/in-toto/in_toto_core
    slot_uri: in_toto_linkml:value
    alias: value
    owner: InTotoAdditionalDigest
    domain_of:
    - InTotoAdditionalDigest
    range: string
    required: true
    pattern: ^\S+$
