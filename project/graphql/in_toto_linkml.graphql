    sha3384: String
    sha3512: String
    shake128: String
    shake256: String
    blake2b: String
    blake2s: String
    ripemd160: String
    sm3: String
    gost: String
    sha1: String
    md5: String
    dirHash: String
    gitCommit: String
    gitTree: String
    gitBlob: String
    gitTag: String
    additionalDigests: [InTotoAdditionalDigest]
  }

type InTotoDocument
  {
    inTotoStatements: [InTotoStatement]
    inTotoPredicateTypes: [InTotoPredicateType]
  }

type InTotoLink
  {
    predicateKind: String
    stepName: String!
    stepCommand: [String]
    materials: [InTotoLinkMaterial]
    stepByproducts: [InTotoObjectEntry]
    stepEnvironment: [InTotoObjectEntry]
  }

type InTotoLinkMaterial
