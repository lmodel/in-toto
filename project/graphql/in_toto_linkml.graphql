enum InTotoTestResultValue
  {
    PASSED
    WARNED
    FAILED
  }

enum InTotoVettedPredicate
  {
    CYCLONEDX
    LINK
    REFERENCE
    RELEASE
    RUNTIME_TRACE
    SCAI
    SLSA_PROVENANCE
    SLSA_VERIFICATION_SUMMARY
