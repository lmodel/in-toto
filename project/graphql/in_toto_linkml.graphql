  }

type InTotoResourceDescriptor
  {
    resourceUri: InTotoResourceUri
    digest: InTotoDigestSet
    resourceName: String
    downloadLocation: InTotoResourceUri
    mediaType: String
    content: String
    annotations: [InTotoAnnotation]
  }

type InTotoRuntimeTrace
  {
    predicateKind: String
    traceMonitor: InTotoTraceMonitor!
    monitoredProcess: InTotoMonitoredProcess!
    monitorLog: InTotoMonitorLog!
