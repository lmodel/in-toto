    digest: InTotoDigestSet!
  }

type InTotoMonitoredProcess
  {
    hostId: String!
    processType: InTotoTypeUri!
    processEvent: String!
  }

type InTotoMonitorLog
  {
    tracedProcesses: [String]
    tracedNetwork: [String]
    fileAccess: [InTotoResourceDescriptor]
  }

type InTotoObjectEntry
  {
    entryKey: String!
    entryValues: [String]
  }

interface InTotoPredicate
  {
    predicateKind: String
  }

type InTotoPredicateType
  {
    predicateTypeUri: InTotoTypeUri!
    predicateVersion: String
    predicateSpecification: String
    vettedAs: InTotoVettedPredicate
  }

type InTotoReference
  {
    predicateKind: String
    referenceAttester: InTotoReferenceAttester!
