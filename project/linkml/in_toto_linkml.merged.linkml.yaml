      "comments": [
        "A field named after an algorithm that SPDX 3 also names relates to SPDX's individual for it. BLAKE2b relates to all three of SPDX's BLAKE2b individuals, because the framework allows any length from 32 to 64 bytes, where SPDX names only lengths of 32, 48 and 64 bytes. SPDX has no individual for the other algorithms, and an SPDX document records them as other.",
