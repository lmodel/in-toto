    "predicate": {
      "name": "predicate",
      "description": "The predicate, one of the kinds this schema or an importing one models; predicate_kind names which. Unset means the same as empty.",
      "comments": [
        "It is a slot of its own rather than an attribute of InTotoStatement, because LOKF's predicate is a relation's type: `lokf adapt` renames a slot whose name LOKF defines, with the name of the schema it adapts as a prefix, and keeps its IRI. This repository's copy calls it in_toto_linkml_predicate, and lmodel/slsa's calls it slsa_predicate."
      ],
