    "in_toto_resource_uri": {
      "name": "in_toto_resource_uri",
      "description": "A URI that identifies or locates a resource, such as a package URL or a git repository address, with its scheme and authority in lowercase.",
      "comments": [
        "The framework recommends a package URL (pkg:) or an SPDX download location (git+https:), and allows one that does not resolve."
      ],
      "from_schema": "https://w3id.org/lmodel/in-toto",
      "see_also": [
        "https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#resourceuri"
      ],
      "typeof": "uri",
      "pattern": "^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$"
    },
    "in_toto_type_uri": {
      "name": "in_toto_type_uri",
      "description": "A URI that names a type, such as a statement's or a predicate's, with its scheme and authority in lowercase.",
      "comments": [
        "The framework asks that it carry a version and registers none, since the namespace of a URI keeps two types apart."
      ],
      "from_schema": "https://w3id.org/lmodel/in-toto",
      "see_also": [
        "https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#typeuri"
      ],
      "typeof": "uri",
      "pattern": "^[a-z][a-z0-9+.-]*:(//[^/?#A-Z]*([/?#].*)?|[^/].*|/[^/].*|/)?$"
    },
    "in_toto_timestamp": {
      "name": "in_toto_timestamp",
      "description": "A point in time in RFC 3339 format in the UTC time zone, written with a trailing Z, such as 1985-04-12T23:20:50.52Z.",
      "comments": [
        "It extends string rather than datetime, because the LinkML Python runtime writes a datetime's Z as +00:00, which the framework does not allow."
      ],
      "from_schema": "https://w3id.org/lmodel/in-toto",
      "see_also": [
        "https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/field_types.md#timestamp"
      ],
      "typeof": "string",
      "base": "str",
      "uri": "xsd:dateTime",
      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
    }
  },
  "enums": {
    "InTotoTestResultValue": {
      "name": "InTotoTestResultValue",
      "description": "The result of a test run, as a Test Result predicate records it.",
      "comments": [
        "PASSED and FAILED mean the outcomes of the same names in W3C's Evaluation and Report Language (EARL) 1.0. EARL has no outcome for a pass with warnings, so WARNED is unmapped.",
        "The meanings are full addresses with no prefix bound for them, because the Python generator writes no namespace for a prefix bound only in an imported module, and shortens a full address to any prefix that covers it. The Python model holds no meaning for them; the other generators keep it."
      ],
      "from_schema": "https://w3id.org/lmodel/in-toto",
      "see_also": [
        "https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md",
        "https://www.w3.org/TR/EARL10-Schema/"
      ],
      "permissible_values": {
        "PASSED": {
          "text": "PASSED",
          "description": "The run passed.",
          "meaning": "http://www.w3.org/ns/earl#passed"
        },
        "WARNED": {
          "text": "WARNED",
          "description": "The run passed with warnings."
        },
        "FAILED": {
          "text": "FAILED",
          "description": "The run failed.",
          "meaning": "http://www.w3.org/ns/earl#failed"
        }
      }
    },
