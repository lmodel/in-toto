---
id: https://w3id.org/lmodel/in-toto/in_toto_predicates
name: in_toto_predicates
title: in-toto vetted predicates
description: >-
  The predicate types the in-toto project has vetted, and the predicates among
  them that no other lmodel schema models: Test Result, Simple Verification
  Result, SCAI Attribute Report, Link, Reference, Release, Runtime Trace and
  VULNS.
license: Apache-2.0
see_also:
  - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
comments:
  - >-
    lmodel/slsa models SLSA Provenance and the SLSA Verification Summary. The
    CycloneDX, SPDX 2 and SPDX 3 predicates carry a whole bill of materials in
    another specification's format, so this module names them by type URI only.

default_prefix: in_toto_linkml
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  in_toto_linkml: https://w3id.org/lmodel/in-toto/
  in_toto: https://in-toto.io/attestation/

imports:
  - linkml:types
  - ./in_toto_core

classes:
  # ── Predicate types ─────────────────────────────────────────────────────

  InTotoPredicateType:
    description: >-
      A type of predicate an in-toto statement can carry, named by the URI a
      statement's predicate_type holds.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/v1/predicate.md
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    comments:
      - >-
        The type URI includes the predicate's major version and changes when the
        predicate changes incompatibly; a minor version keeps it.
      - >-
        Anyone can define a predicate type. The in-toto project vets some of them,
        and vetted_as names which vetted type this one is.
    attributes:
      predicate_type_uri:
        description: >-
          The URI that names the predicate type, such as
          https://in-toto.io/attestation/test-result/v0.1.
        range: in_toto_type_uri
        required: true
      predicate_version:
        description: >-
          The version of the predicate's specification, as its page states it, such
          as 0.1.0.
      predicate_specification:
        description: The page that specifies the predicate.
        range: uri
      vetted_as:
        description: The vetted predicate this type is, when the in-toto project vetted it.
        range: InTotoVettedPredicate

  InTotoObjectEntry:
    description: >-
      One key of a JSON object whose keys the framework leaves to the producer, and
      the key's values.
    comments:
      - >-
        A string becomes one value and an array one value per item; any other value
        or item is written as its JSON text, as InTotoAnnotation does.
      - >-
        Each key appears once in a list, since the attestation's JSON uses it as a
        key; the validator does not check this.
    attributes:
      entry_key:
        description: The object's key.
        required: true
      entry_values:
        description: The key's values.
        multivalued: true

  # ── Test Result ─────────────────────────────────────────────────────────

  InTotoTestResult:
    is_a: InTotoPredicate
    description: >-
      The predicate that records the result of one run of a test suite against the
      subjects, with the names of the tests that passed, warned and failed.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md
    exact_mappings:
      - in_toto:test-result/v0.1
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/test-result/v0.1.
      - One attestation records one invocation of a suite.
    attributes:
      test_result:
        description: The result of the test run.
        range: InTotoTestResultValue
        required: true
      configuration:
        description: The configuration the test run used.
        range: InTotoResourceDescriptor
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      test_run_url:
        description: >-
          Where the test run can be read, such as a CI run that holds its logs; the
          verifier works out how to read it.
        range: in_toto_resource_uri
      passed_tests:
        description: The names of the tests that passed.
        multivalued: true
      warned_tests:
        description: The names of the tests that expressed a warning.
        multivalued: true
      failed_tests:
        description: The names of the tests that failed.
        multivalued: true
        comments:
          - >-
            Producer and consumer agree on what a test name means; a policy can
            check that test_result and failed_tests meet its requirements.

  # ── Simple Verification Result ──────────────────────────────────────────

  InTotoSimpleVerificationResult:
    is_a: InTotoPredicate
    description: >-
      The predicate that says a verifier evaluated the subjects against one or more
      policies, and which properties passed.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/svr.md
    exact_mappings:
      - in_toto:svr/v0.1
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/svr/v0.1.
      - It is a lighter form of the SLSA Verification Summary, which lmodel/slsa models.
    attributes:
      svr_verifier:
        description: The entity that performed the verification.
        range: InTotoSvrVerifier
        required: true
        inlined: true
      time_created:
        description: When the verification took place.
        range: in_toto_timestamp
        required: true
      verified_properties:
        description: >-
          The properties of the subjects that passed verification, scoped to the
          framework or policy verified, such as SLSA_BUILD_LEVEL_3.
        multivalued: true
        required: true

  InTotoSvrVerifier:
    description: The entity that performed a simple verification.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/svr.md
    comments:
      - >-
        A verifier with configurable policies may add fields of its own that say
        which policy it applied; this schema does not model them.
    attributes:
      svr_verifier_id:
        description: >-
          The URI that identifies the verifier, versioned when its verification logic
          changes materially.
        range: in_toto_type_uri
        required: true

  # ── SCAI Attribute Report ───────────────────────────────────────────────

  InTotoScaiAttributeReport:
    is_a: InTotoPredicate
    description: >-
      The Software Supply Chain Attribute Integrity (SCAI) predicate: assertions
      about functional attributes of the subjects or their producer, each with the
      evidence for it.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    exact_mappings:
      - in_toto:scai/v0.3
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/scai/v0.3.
    attributes:
      scai_attributes:
        description: One or more attribute assertions about the subjects.
        range: InTotoScaiAttributeAssertion
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      scai_producer:
        description: The producer of the subjects, where that applies.
        range: InTotoResourceDescriptor
        inlined: true

  InTotoScaiAttributeAssertion:
    description: >-
      One SCAI assertion: an attribute of the subject or its producer, what it
      applies to, under which conditions, and the evidence for it.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/scai.md
    attributes:
      scai_attribute:
        description: >-
          The functional feature asserted, in a form the producer and consumer agree
          on.
        required: true
      scai_target:
        description: The artifact or metadata object the attribute applies to.
        range: InTotoResourceDescriptor
        inlined: true
      scai_conditions:
        description: The conditions under which the attribute arises.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      scai_evidence:
        description: >-
          The evidence, authenticated where possible, for the asserted attribute.
        range: InTotoResourceDescriptor
        inlined: true
        comments:
          - >-
            Without evidence a consumer may judge the assertion by who produced
            the attestation.

  # ── Link ────────────────────────────────────────────────────────────────

  InTotoLink:
    is_a: InTotoPredicate
    description: >-
      The predicate that records one step of an in-toto layout: the command it ran
      and the materials it read, for a supply chain that migrates from in-toto 0.9
      links.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    exact_mappings:
      - in_toto:link/v0.3
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/link/v0.3.
      - >-
        The statement's subjects are the step's products, and each subject's
        resource_name is unique within the attestation; the validator does not
        check this.
    attributes:
      step_name:
        description: >-
          The name of the step, which a layout uses to find the link metadata it
          verifies.
        required: true
      step_command:
        description: The command the step ran, and its arguments; possibly empty.
        multivalued: true
      materials:
        description: The artifacts the step read.
        range: InTotoLinkMaterial
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
          - Each material's resource_name is unique among them; the validator does not check this.
      step_byproducts:
        description: >-
          What else the step recorded, such as its standard output, in keys the
          in-toto specification describes.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true
      step_environment:
        description: The environment the step ran in, in keys the producer chooses.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true

  InTotoLinkMaterial:
    is_a: InTotoResourceDescriptor
    description: One material of a link, a resource descriptor with a name and a digest.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/link.md
    notes:
      - >-
        The name is required through a slot condition rather than slot_usage,
        because resource_name is an attribute of the parent class and the LinkML
        loader refuses slot_usage on an inherited attribute.
    slot_usage:
      digest:
        required: true
    all_of:
      - slot_conditions: {resource_name: {required: true, any_of: [{range: string}]}}

  # ── Reference ───────────────────────────────────────────────────────────

  InTotoReference:
    is_a: InTotoPredicate
    description: >-
      The predicate that points from the subjects, as a whole, to documents about
      them, such as a bill of materials.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    exact_mappings:
      - in_toto:reference/v0.1
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/reference/v0.1.
      - >-
        Several documents in one predicate read as if each had an attestation of its
        own with everything else unchanged.
    attributes:
      reference_attester:
        description: The system that provides the documents.
        range: InTotoReferenceAttester
        required: true
        inlined: true
      referenced_documents:
        description: The documents referred to.
        range: InTotoReferencedDocument
        multivalued: true
        required: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true

  InTotoReferenceAttester:
    description: The system that provides the documents a Reference predicate points to.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    attributes:
      reference_attester_id:
        description: The URI that identifies the system.
        range: in_toto_type_uri
        required: true

  InTotoReferencedDocument:
    is_a: InTotoResourceDescriptor
    description: >-
      One document a Reference predicate points to: a resource descriptor with a
      download location and a media type.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/reference.md
    comments:
      - A document of unknown type takes media_type application/octet-stream.
    notes:
      - >-
        Both fields are required through slot conditions rather than slot_usage,
        because they are attributes of the parent class and the LinkML loader
        refuses slot_usage on an inherited attribute.
    all_of:
      - slot_conditions: {download_location: {required: true, any_of: [{range: uri}]}}
      - slot_conditions: {media_type: {required: true, any_of: [{range: string}]}}

  # ── Release ─────────────────────────────────────────────────────────────

  InTotoRelease:
    is_a: InTotoPredicate
    description: >-
      The predicate that ties the subjects to one release name and version of a
      package, so that consumers can check what the release should contain.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/release.md
    exact_mappings:
      - in_toto:release/v0.1
    comments:
      - >-
        The statement that carries it has predicate_type
        https://in-toto.io/attestation/release/v0.1. The page is at version 0.2,
        which renamed releaseId to packageId, and its examples keep that URI.
      - Each subject's resource_name is the artifact's file name as it would appear on disk.
    attributes:
      release_purl:
        description: >-
          The package URL that names the release, with its version and, unless the
          package type needs them, no qualifiers or subpath.
        range: in_toto_resource_uri
        required: true
        pattern: "^pkg:[A-Za-z][A-Za-z0-9.+-]*/[^?#]+@[^@?#]+"
        comments:
          - >-
            The version follows the last @, as the purl specification parses a package
            URL, so a scoped npm name such as @angular/http may keep its @ unencoded,
            as the page's first example does.
      package_id:
        description: >-
          A stable identifier for the package that does not change between releases,
          so that a consumer can tell a renamed package from a reused name.

  # ── Runtime Trace ───────────────────────────────────────────────────────

  InTotoRuntimeTrace:
    is_a: InTotoPredicate
    description: >-
      The predicate that records what a monitor traced while a supply chain step,
      such as a build, ran.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    exact_mappings:
      - in_toto:runtime-trace/v0.1
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/runtime-trace/v0.1.
    attributes:
      trace_monitor:
        description: The monitor instance that traced the run.
        range: InTotoTraceMonitor
        required: true
        inlined: true
      monitored_process:
        description: The process the monitor watched.
        range: InTotoMonitoredProcess
        required: true
        inlined: true
      monitor_log:
        description: The events the monitor traced.
        range: InTotoMonitorLog
        required: true
        inlined: true
      trace_metadata:
        description: Other properties of the monitoring event.
        range: InTotoTraceMetadata
        inlined: true

  InTotoTraceMonitor:
    description: The monitor instance that produced a runtime trace.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      monitor_type:
        description: The URI of the monitor's type.
        range: in_toto_type_uri
        required: true
      monitor_config_source:
        description: The monitor's configuration.
        range: InTotoResourceDescriptor
        inlined: true
      trace_policy:
        description: >-
          The trace policy the monitor applied, in the monitor's own format, which
          monitor_type names.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true

  InTotoMonitoredProcess:
    description: The process a runtime trace watched.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      host_id:
        description: The URI that identifies the host the process ran on.
        range: uri
        required: true
      process_type:
        description: >-
          The URI of the type of process, such as the build type when the monitor
          watched a build.
        range: in_toto_type_uri
        required: true
      process_event:
        description: The job or task the attestation is about.
        required: true

  InTotoMonitorLog:
    description: >-
      The events a runtime trace's monitor recorded: processes, network activity
      and file accesses, at least one of them.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    notes:
      - >-
        Each condition in any_of names its range through a nested any_of, because the
        JSON Schema generator leaves a condition's own range out, and a null value
        would then count as present.
    attributes:
      traced_processes:
        description: >-
          The processes the monitor observed, one JSON object each, written as its
          JSON text, in a format monitor_type determines.
        multivalued: true
      traced_network:
        description: >-
          The network activity the monitor observed, one JSON object each, written as
          its JSON text, in a format monitor_type determines.
        multivalued: true
      file_access:
        description: >-
          The files the run accessed, each with its path and digests; one file may
          appear more than once, with different digests if it changed.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
          - >-
            A monitor that cannot pause the build, such as one that uses eBPF,
            guarantees less about these digests than one that can.
    any_of:
      - slot_conditions: {traced_processes: {required: true, multivalued: true}}
      - slot_conditions: {traced_network: {required: true, multivalued: true}}
      - slot_conditions: {file_access: {required: true, multivalued: true}}

  InTotoTraceMetadata:
    description: Other properties of a runtime trace's monitoring event.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/runtime-trace.md
    attributes:
      build_started_on:
        description: When the monitored build started.
        range: in_toto_timestamp
      build_finished_on:
        description: When the monitored build finished.
        range: in_toto_timestamp

  # ── VULNS ───────────────────────────────────────────────────────────────

  InTotoVulns:
    is_a: InTotoPredicate
    description: >-
      The predicate that records the result of one vulnerability scan of the
      subjects: the scanner, its database and the vulnerabilities it found.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    exact_mappings:
      - in_toto:vulns/v0.2
    comments:
      - The statement that carries it has predicate_type https://in-toto.io/attestation/vulns/v0.2.
    attributes:
      vuln_scanner:
        description: The scanner that ran, its version and the database it used.
        range: InTotoVulnScanner
        required: true
        inlined: true
      scan_metadata:
        description: When the scan ran.
        range: InTotoScanMetadata
        required: true
        inlined: true

  InTotoVulnScanner:
    description: The scanner a VULNS predicate records, with its results.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      scanner_uri:
        description: The URI that identifies the scanner's source.
        range: in_toto_resource_uri
        required: true
      scanner_version:
        description: The scanner's version.
        comments:
          - >-
            The page types it as a ResourceURI, and its example is a plain version,
            0.19.2, so the schema takes any string.
      vuln_db:
        description: The vulnerability database the scanner used.
        range: InTotoVulnDatabase
        inlined: true
      scan_results:
        description: >-
          The vulnerabilities the scanner found; an empty list means it found none.
        range: InTotoVulnResult
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true

  InTotoVulnDatabase:
    description: The vulnerability database a scanner used.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      db_uri:
        description: The URI that identifies the database's source.
        range: in_toto_resource_uri
      db_version:
        description: The database's version.
      db_last_update:
        description: When the database was last updated.
        range: in_toto_timestamp
        required: true

  InTotoVulnResult:
    description: One vulnerability a scanner found.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      vuln_id:
        description: >-
          The vulnerability's identifier, such as GHSA-fxph-q3j8-mv87 or
          CVE-2017-5645.
        required: true
      vuln_severity:
        description: The vulnerability's severity, by one or more scoring methods.
        range: InTotoVulnSeverity
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      vuln_annotations:
        description: Custom information the scanner adds, as key and value pairs.
        range: InTotoObjectEntry
        multivalued: true
        inlined: true
        inlined_as_list: true

  InTotoVulnSeverity:
    description: One severity score of a vulnerability, by one scoring method.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      severity_method:
        description: The scoring method, such as nvd or cvss.
        required: true
      severity_score:
        description: The score under that method, as a string.
        required: true

  InTotoScanMetadata:
    description: When a vulnerability scan ran.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/vulns_02.md
    attributes:
      scan_started_on:
        description: When the scan started.
        range: in_toto_timestamp
        required: true
      scan_finished_on:
        description: When the scan finished.
        range: in_toto_timestamp
        required: true

enums:
  InTotoTestResultValue:
    description: The result of a test run, as a Test Result predicate records it.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/test-result.md
    permissible_values:
      PASSED:
        description: The run passed.
      WARNED:
        description: The run passed with warnings.
      FAILED:
        description: The run failed.

  InTotoVettedPredicate:
    description: >-
      The thirteen predicate types the in-toto project lists as vetted at release
      v1.2.0, each with the predicate_type a statement of it carries at the
      version its page describes.
    comments:
      - >-
        The in-toto project's own types are CURIEs under in_toto. The others are
        full addresses, because the Python generator writes no namespace for a
        prefix that only an enum's meaning uses.
    see_also:
      - https://github.com/in-toto/attestation/blob/v1.2.0/spec/predicates/README.md
    permissible_values:
      CYCLONEDX:
        description: A CycloneDX bill of materials for software artifacts.
        meaning: https://cyclonedx.org/bom/v1.4
        see_also:
          - https://cyclonedx.org/
      LINK:
        description: One step of an in-toto layout, for migration from in-toto 0.9.
        meaning: in_toto:link/v0.3
      REFERENCE:
        description: References to documents relevant to a resource.
        meaning: in_toto:reference/v0.1
      RELEASE:
        description: An artifact that is part of a given release version.
        meaning: in_toto:release/v0.1
      RUNTIME_TRACE:
        description: Runtime traces of software supply chain operations.
        meaning: in_toto:runtime-trace/v0.1
      SCAI:
        description: >-
          Evidence-based assertions about software artifact and supply chain
          attributes or behaviour.
        meaning: in_toto:scai/v0.3
      SLSA_PROVENANCE:
        description: >-
          How an artifact or set of artifacts was produced; lmodel/slsa models it.
        meaning: https://slsa.dev/provenance/v1
      SLSA_VERIFICATION_SUMMARY:
        description: >-
          A SLSA verification decision about a software artifact; lmodel/slsa
          models it.
        meaning: https://slsa.dev/verification_summary/v1
      SPDX2:
        description: An SPDX 2 bill of materials for software artifacts.
        meaning: https://spdx.dev/Document/v2.3
      SPDX3:
        description: An SPDX 3 bill of materials for software artifacts.
        meaning: https://spdx.dev/Document/v3
      SIMPLE_VERIFICATION_RESULT:
        description: Evidence that an artifact was evaluated against one or more policies.
        meaning: in_toto:svr/v0.1
      TEST_RESULT:
        description: The results of any type of test.
        meaning: in_toto:test-result/v0.1
      VULNS:
        description: The results of a vulnerability scan of software artifacts.
        meaning: in_toto:vulns/v0.2
