# A trace of a build's network activity.
trace_monitor:
  monitor_type: https://github.com/cilium/tetragon
monitored_process:
  host_id: https://github.com/actions/runner
  process_type: https://actions.github.io/buildtypes/workflow/v1
  process_event: build
monitor_log:
  traced_network:
    - '{"destination": "pypi.org", "port": 443}'
