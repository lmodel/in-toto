statement_type: https://in-toto.io/Statement/v1
subject:
  - resource_name: app.tar.gz
    digest:
      sha256: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
predicate_type: https://in-toto.io/attestation/scai/v0.3
statement_predicate:
  predicate_kind: InTotoScaiAttributeReport
  scai_attributes:
