      scai_evidence:
        resource_name: app.spdx.json
        media_type: application/spdx+json
        digest:
          sha256: abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890
  scai_producer:
    resource_uri: https://github.com/example/app/.github/workflows/release.yml
